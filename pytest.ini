[pytest]
# Pytest configuration

minversion = 7.0
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --maxfail=5
    -p no:warnings

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: API tests
    training: Training pipeline tests

# Coverage options
[coverage:run]
source = inference,training,frontend
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
