name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio flake8 black --upgrade
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check . --exclude=venv,.venv,./venv_new
      continue-on-error: true
    
    - name: Run unit tests with pytest
      run: |
        pytest tests/ -v --tb=short --cov=inference --cov=training --cov-report=xml --cov-report=html
      continue-on-error: false
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
    
    - name: Verify project structure
      run: |
        echo "Checking project structure..."
        test -d "data" && echo "✓ data directory exists" || echo "✗ data directory missing"
        test -d "training" && echo "✓ training directory exists" || echo "✗ training directory missing"
        test -d "inference" && echo "✓ inference directory exists" || echo "✗ inference directory missing"
        test -d "frontend" && echo "✓ frontend directory exists" || echo "✗ frontend directory missing"
        test -f "requirements.txt" && echo "✓ requirements.txt exists" || echo "✗ requirements.txt missing"
        test -f "README.md" && echo "✓ README.md exists" || echo "✗ README.md missing"
        test -d "models" && echo "✓ models directory exists" || echo "✗ models directory missing"
    
    - name: Verify model artifacts exist
      run: |
        echo "Checking model artifacts..."
        test -f "models/heart_disease_model.pkl" && echo "✓ model file exists" || echo "✗ model file missing"
        test -f "models/scaler.pkl" && echo "✓ scaler file exists" || echo "✗ scaler file missing"
        test -f "models/label_encoder.pkl" && echo "✓ encoder file exists" || echo "✗ encoder file missing"
        test -f "models/feature_columns.pkl" && echo "✓ feature_columns file exists" || echo "✗ feature_columns file missing"
    
    - name: Test FastAPI imports
      run: |
        python -c "from fastapi import FastAPI; print('✓ FastAPI imports OK')"
        python -c "import inference.app; print('✓ Inference app imports OK')"
        python -c "import training.train; print('✓ Training module imports OK')"
      continue-on-error: false

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Code quality checks completed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Project structure verified" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
    
    - name: Archive test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-artifacts
        path: |
          logs/
          htmlcov/
        retention-days: 30
        compression-level: 6
      continue-on-error: true
